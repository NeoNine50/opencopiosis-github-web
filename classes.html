<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCopiosis - Classes</title>

    <!-- DataTables CSS for Search and Pagination -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            color: #222;
            text-align: center;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .top-bar-container {
            max-width: 1100px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 0 16px;
            box-sizing: border-box;
        }

        .brand-title {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 2px 0;
        }

        .logo-img {
            width: 43px;
            height: 43px;
            display: block;
            margin: 4px 12px 4px 6px;
            transition: transform 0.2s ease;
        }

        .brand-title:hover .logo-img {
            transform: scale(1.08);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: #333;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
        }

            .nav-link:hover {
                background-color: #e6e6e6;
                border-color: #adadad;
                color: #333;
            }

            .nav-link.active {
                background-color: #e6e6e6;
                border-color: #adadad;
                color: #333;
                box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
                font-weight: bold;
            }

        /* Unified Menu Button Styling */
        .menu-btn {
            display: none;
            background: #ffffff;
            border: 1px solid #ccc;
            font-size: 28px;
            color: #555;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

            .menu-btn:hover {
                background-color: #f2f2f2;
            }

            .menu-btn:active {
                transform: scale(0.95);
            }

            /* The pressed-in state when the menu is open */
            .menu-btn.pressed {
                background-color: #e6e6e6;
                border-color: #adadad;
                box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
                color: #222;
            }

        @media (max-width: 900px) {
            .menu-btn {
                display: block;
            }

            .nav-menu {
                display: none;
                flex-direction: column;
                gap: 10px;
                background: #fff;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 16px;
                position: absolute;
                right: 16px;
                top: 100%;
                margin-top: 8px;
                width: 220px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.15);
                z-index: 1001;
                text-align: left;
                box-sizing: border-box;
            }

                .nav-menu.open {
                    display: flex;
                }

            .nav-link {
                border: none;
                background: transparent;
                padding: 4px 0;
                font-size: 16px;
                color: #000;
            }

                .nav-link:hover {
                    background: transparent;
                    color: #555;
                }

                .nav-link.active {
                    background: transparent;
                    color: #000;
                    font-weight: bold;
                    text-decoration: none;
                    box-shadow: none;
                }
        }

        .main-content {
            max-width: 1000px;
            margin: 90px auto 0 auto;
            padding: 16px;
        }

        .table-container {
            overflow-x: auto;
            margin: 0 auto 16px auto;
        }

        /* Clean table styles overriding DataTables defaults */
        table.dataTable {
            width: 100% !important;
            margin-top: 16px !important;
            background: #fff;
            border-collapse: collapse;
            min-width: 600px;
        }

            table.dataTable thead th {
                background: #f2f2f2;
                border-bottom: 2px solid #ccc;
                padding: 8px 10px;
            }

            table.dataTable td, table.dataTable th {
                border-bottom: 1px solid #eee;
                padding: 8px 10px;
                text-align: center;
            }

        /* Clickable row hover styles */
        #classesTable tbody tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }

            #classesTable tbody tr:hover {
                background-color: #eaeaea !important;
            }

        .action-btn {
            background-color: #e6e6e6;
            border: 1px solid #adadad;
            color: #333;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.2s;
        }

            .action-btn:hover {
                background-color: #ccc;
            }

        .op-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #ccc;
            border-top: 5px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div id="loader-overlay"><div class="spinner"></div></div>

    <header class="top-bar">
        <div class="top-bar-container">
            <a href="index.html" class="brand-title" title="OpenCopiosis Home">
                <img src="OpenCopiosis.jfif" alt="OpenCopiosis Logo" class="logo-img" />
            </a>
            <div class="nav-item-dropdown-wrapper">
                <button class="menu-btn" onclick="toggleNav(event)" aria-label="Toggle menu">&#9776;</button>
                <nav id="navMenu" class="nav-menu">
                    <a href="users.html" class="nav-link">Show users</a>
                    <a href="products.html" class="nav-link">Show items</a>
                    <a href="classes.html" class="nav-link active">Show classes</a>
                    <a href="transfers.html" class="nav-link">Show transactions</a>
                    <a href="adduser.html" class="nav-link">Add user</a>
                    <a href="product.html" class="nav-link">Add item</a>
                    <a href="addclass.html" class="nav-link">Add class</a>
                    <a href="transfer.html" class="nav-link">Create transaction</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px;">
            <h3 style="margin: 0;">Classes Overview</h3>
            <button class="action-btn" onclick="window.location.href='addclass.html'" style="padding: 10px 16px;">+ Create New Class</button>
        </div>
        <div class="table-container">
            <table id="classesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Class Name</th>
                        <th>Sugg. Gateway</th>
                        <th>Proj. Reward</th>
                        <th>Assigned Products</th>
                        <th>Created</th>
                        <th>Operation</th>
                    </tr>
                </thead>
                <tbody id="classes-tbody"></tbody>
            </table>
        </div>
    </div>

    <footer>
        &copy; <span id="currentYear"></span> OpenCopiosis
    </footer>

    <!-- jQuery and DataTables plugins required for search/pagination -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="store.js"></script>
    <script src="nbr.js"></script>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function showLoading() { document.getElementById('loader-overlay').style.display = 'flex'; }

        function toggleNav(e) {
            if (e) e.stopPropagation();
            const navMenu = document.getElementById('navMenu');
            const menuBtn = document.querySelector('.menu-btn');

            navMenu.classList.toggle('open');

            if (navMenu.classList.contains('open')) {
                menuBtn.classList.add('pressed');
            } else {
                menuBtn.classList.remove('pressed');
            }
        }

        document.addEventListener('click', function (e) {
            const wrapper = document.querySelector('.nav-item-dropdown-wrapper');
            const navMenu = document.getElementById('navMenu');
            const menuBtn = document.querySelector('.menu-btn');

            if (wrapper && !wrapper.contains(e.target)) {
                navMenu.classList.remove('open');
                if (menuBtn) menuBtn.classList.remove('pressed');
            }
        });

        function renderClasses() {
            const classes = DB.get('classes') || [];
            const products = DB.get('products') || [];
            const userProducts = DB.get('user_products') || [];

            // Destroy existing DataTables instance before rebuilding the rows
            if ($.fn.DataTable.isDataTable('#classesTable')) {
                $('#classesTable').DataTable().destroy();
            }

            const tbody = $('#classes-tbody');
            tbody.empty();

            classes.forEach(c => {
                // Find all product IDs that belong to this specific class
                const classProductIds = products.filter(p => p.class_id === c.id).map(p => p.id);
                // Count how many user_products entries match those specific product IDs
                const assignedCount = userProducts.filter(up => classProductIds.includes(up.ProductID)).length;

                // Calculate Projected Reward using Copiosis Algorithm
                const resabundance = c.resabundance ?? 1;
                const beneficiaries = c.beneficiaries ?? 1;
                const producers = c.producers ?? 1;
                const ccs = c.ccs ?? 1;
                const conssubben = c.conssubben ?? 0;
                const cco = c.cco ?? 1;
                const consobjben = c.consobjben ?? 0;
                const ceb = c.ceb ?? 1;
                const envben = c.envben ?? 0;
                const chb = c.chb ?? 1;
                const humanben = c.humanben ?? 0;

                const projReward = CopiosisNBR.calculateNBR({
                    resabundance, beneficiaries, producers, ccs, conssubben, cco,
                    consobjben, ceb, envben, chb, humanben
                });

                tbody.append(`
                    <tr onclick="window.location.href='addclass.html?id=${c.id}'" title="Click to edit class">
                        <td>${c.id}</td>
                        <td>${c.name}</td>
                        <td>${c.suggestedGateway}</td>
                        <td>${projReward}</td>
                        <td>${assignedCount}</td>
                        <td>${c.time_created}</td>
                        <td>
                            <div class="op-actions">
                                <button class="action-btn" onclick="event.stopPropagation(); window.location.href='addclass.html?id=${c.id}'">Edit class</button>
                                <button class="action-btn" onclick="deleteClass(event, ${c.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `);
            });

            // Initialize DataTable for Search and Pagination
            $('#classesTable').DataTable({
                pageLength: 10,
                searching: true,
                ordering: true,
                stripeClasses: []
            });
        }

        function deleteClass(event, id) {
            // Prevent row click from firing when Delete is clicked
            event.stopPropagation();

            let classes = DB.get('classes') || [];
            if (classes.length <= 1) return alert("Cannot delete the last remaining class.");
            if (!confirm("Are you sure you want to delete this class? Products mapped to this class will revert to Default.")) return;

            classes = classes.filter(c => c.id !== id);
            DB.set('classes', classes);

            // Revert products mapped to deleted class
            let products = DB.get('products') || [];
            products.forEach(p => { if (p.class_id === id) p.class_id = 1; });
            DB.set('products', products);
            alert('Class deleted successfully!');

            renderClasses();
        }

        // Call render on document ready so DataTables fires safely
        $(document).ready(function () {
            renderClasses();
        });
    </script>
</body>
</html>
