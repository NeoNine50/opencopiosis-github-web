<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCopiosis - Transactions</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            color: #222;
            text-align: center;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .top-bar-container {
            max-width: 1100px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 0 16px;
            box-sizing: border-box;
        }

        .brand-title {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 2px 0;
        }

        .logo-img {
            width: 43px;
            height: 43px;
            display: block;
            margin: 4px 12px 4px 6px;
            transition: transform 0.2s ease;
        }

        .brand-title:hover .logo-img {
            transform: scale(1.08);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: #333;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
        }

            .nav-link:hover {
                background-color: #e6e6e6;
                border-color: #adadad;
                color: #333;
            }

            .nav-link.active {
                background-color: #e6e6e6;
                border-color: #adadad;
                color: #333;
                box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
                font-weight: bold;
            }

        /* Unified Menu Button Styling */
        .menu-btn {
            display: none;
            background: #ffffff;
            border: 1px solid #ccc;
            font-size: 28px;
            color: #555;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

            .menu-btn:hover {
                background-color: #f2f2f2;
            }

            .menu-btn:active {
                transform: scale(0.95);
            }

            /* The pressed-in state when the menu is open */
            .menu-btn.pressed {
                background-color: #e6e6e6;
                border-color: #adadad;
                box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
                color: #222;
            }

        @media (max-width: 900px) {
            .menu-btn {
                display: block;
            }

            .nav-menu {
                display: none;
                flex-direction: column;
                gap: 10px;
                background: #fff;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 16px;
                position: absolute;
                right: 16px;
                top: 100%;
                margin-top: 8px;
                width: 220px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.15);
                z-index: 1001;
                text-align: left;
                box-sizing: border-box;
            }

                .nav-menu.open {
                    display: flex;
                }

            .nav-link {
                border: none;
                background: transparent;
                padding: 4px 0;
                font-size: 16px;
                color: #000;
            }

                .nav-link:hover {
                    background: transparent;
                    color: #555;
                }

                .nav-link.active {
                    background: transparent;
                    color: #000;
                    font-weight: bold;
                    text-decoration: none;
                    box-shadow: none;
                }
        }

        .main-content {
            max-width: 1100px;
            margin: 90px auto 0 auto;
            padding: 16px;
            transition: opacity 0.3s ease;
        }

        /* Checkered Table & Hover Styling */
        table.dataTable {
            width: 100% !important;
            margin-top: 16px !important;
            background: #fff;
            border-collapse: collapse;
        }

            table.dataTable thead th {
                background: #f2f2f2;
                border-bottom: 2px solid #ccc;
            }

            table.dataTable td, table.dataTable th {
                border-bottom: 1px solid #eee;
                padding: 8px 10px;
            }

            table.dataTable tbody tr:nth-child(even) {
                background-color: #f2f2f2;
            }

            table.dataTable tbody tr:nth-child(odd) {
                background-color: #ffffff;
            }

            table.dataTable tbody tr:hover {
                background-color: #eaeaea !important;
                cursor: pointer;
            }

        .action-btn {
            background-color: #e6e6e6;
            border: 1px solid #adadad;
            color: #333;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
            margin-right: 4px;
            white-space: nowrap;
        }

            .action-btn:hover {
                background-color: #ccc;
            }

        /* Loader Overlay */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #ccc;
            border-top: 5px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <div id="loader-overlay"><div class="spinner"></div></div>

    <header class="top-bar">
        <div class="top-bar-container">
            <a href="index.html" class="brand-title" title="OpenCopiosis Home">
                <img src="OpenCopiosis.jfif" alt="OpenCopiosis Logo" class="logo-img" />
            </a>
            <div class="nav-item-dropdown-wrapper">
                <button class="menu-btn" onclick="toggleNav(event)" aria-label="Toggle menu">&#9776;</button>
                <nav id="navMenu" class="nav-menu">
                    <a href="users.html" class="nav-link">Show users</a>
                    <a href="products.html" class="nav-link">Show items</a>
                    <a href="classes.html" class="nav-link">Show classes</a>
                    <a href="transfers.html" class="nav-link active">Show transactions</a>
                    <a href="adduser.html" class="nav-link">Add user</a>
                    <a href="product.html" class="nav-link">Add item</a>
                    <a href="addclass.html" class="nav-link">Add class</a>
                    <a href="transfer.html" class="nav-link">Create transaction</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
            <h3 style="margin: 0;">Showing All Transactions</h3>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn" onclick="exportCSV()" style="padding: 10px 16px; font-size: 14px; margin-right: 0;">Create CSV</button>
                <button class="action-btn" onclick="window.location.href='transfer.html'" style="padding: 10px 16px; font-size: 14px; margin-right: 0;">+ Create Transaction</button>
            </div>
        </div>

        <table id="transferTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producer</th>
                    <th>Consumer</th>
                    <th>Product</th>
                    <th>Amount</th>
                    <th>NBR awarded</th>
                    <th>NBR removed</th>
                    <th>Created</th>
                    <th>Operation</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <footer>
        &copy; <span id="currentYear"></span> OpenCopiosis
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="store.js"></script>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function showLoading() {
            document.getElementById('loader-overlay').style.display = 'flex';
            document.querySelector('.main-content').style.opacity = '0.3';
        }

        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                if (this.href && !this.href.startsWith('javascript') && this.target !== '_blank') {
                    showLoading();
                }
            });
        });

        function toggleNav(e) {
            if (e) e.stopPropagation();
            const navMenu = document.getElementById('navMenu');
            const menuBtn = document.querySelector('.menu-btn');

            navMenu.classList.toggle('open');

            if (navMenu.classList.contains('open')) {
                menuBtn.classList.add('pressed');
            } else {
                menuBtn.classList.remove('pressed');
            }
        }

        document.addEventListener('click', function (e) {
            const wrapper = document.querySelector('.nav-item-dropdown-wrapper');
            const navMenu = document.getElementById('navMenu');
            const menuBtn = document.querySelector('.menu-btn');

            if (wrapper && !wrapper.contains(e.target)) {
                navMenu.classList.remove('open');
                if (menuBtn) menuBtn.classList.remove('pressed');
            }
        });

        function renderTransfers() {
            const transfers = DB.get('transfers') || [];
            const users = DB.get('users') || [];
            const products = DB.get('products') || [];
            const tbody = $('#transferTable tbody');

            tbody.empty();

            transfers.forEach(t => {
                const p = users.find(u => u.id === t.ProducerID) || { name: 'Unknown' };
                const c = users.find(u => u.id === t.ConsumerID) || { name: 'nobody/everybody' };
                const prod = products.find(pr => pr.id === t.ProductID) || { name: 'Unknown' };

                const ops = `
                        <div style="white-space: nowrap;">
                            <button class="action-btn" onclick="viewTransfer(event, ${t.id})">View details</button>
                            <button class="action-btn" onclick="deleteTransfer(event, ${t.id})">Delete record</button>
                        </div>
                    `;

                tbody.append(`
                        <tr onclick="viewTransfer(event, ${t.id})">
                            <td>${t.id}</td>
                            <td>${p.name}</td>
                            <td>${c.name}</td>
                            <td>${prod.name}</td>
                            <td>${t.amount}</td>
                            <td>${t.nbr}</td>
                            <td>${t.gnbr}</td>
                            <td data-order="${t.id}">${t.time_created}</td>
                            <td>${ops}</td>
                        </tr>
                    `);
            });

            if ($.fn.DataTable.isDataTable('#transferTable')) {
                $('#transferTable').DataTable().destroy();
            }
            $('#transferTable').DataTable({
                pageLength: 10,
                searching: true,
                ordering: true,
                order: [[7, 'desc']], // Sorts the 8th column (Created) descending by default using data-order
                stripeClasses: []
            });
        }

        function viewTransfer(event, id) {
            if (event) event.stopPropagation();
            showLoading();
            window.location.href = `viewtransfer.html?id=${id}`;
        }

        function deleteTransfer(event, id) {
            if (event) event.stopPropagation();

            if (!confirm("Are you sure you want to delete this record?")) return;

            let transfers = DB.get('transfers') || [];
            const users = DB.get('users') || [];
            const t = transfers.find(x => x.id === id);

            if (t) {
                const producer = users.find(u => u.id === t.ProducerID);
                if (producer) {
                    producer.nbr = Math.max(0.0, producer.nbr - t.nbr);
                    producer.fame = Math.max(0.0, producer.fame - t.nbr);
                }
                const consumer = users.find(u => u.id === t.ConsumerID);
                if (consumer && t.ConsumerID !== 0) {
                    consumer.nbr += t.gnbr;
                }

                transfers = transfers.filter(x => x.id !== id);
                DB.set('users', users);
                DB.set('transfers', transfers);
                alert('Transaction record deleted successfully!');
                renderTransfers();
            }
        }

        function exportCSV() {
            const transfers = DB.get('transfers') || [];
            const users = DB.get('users') || [];
            const products = DB.get('products') || [];

            if (transfers.length === 0) {
                alert("No transactions available to export.");
                return;
            }

            let csv = "Transaction ID,Producer,Consumer,Product,Amount,NBR Awarded,NBR Removed,Created Date,Notes\n";

            transfers.forEach(t => {
                const p = users.find(u => u.id === t.ProducerID) || { name: 'Unknown' };
                const c = users.find(u => u.id === t.ConsumerID) || { name: 'nobody/everybody' };
                const prod = products.find(pr => pr.id === t.ProductID) || { name: 'Unknown' };

                // Helper to escape double quotes and wrap string in double quotes for safe CSV injection
                const escapeCSV = (str) => `"${String(str || '').replace(/"/g, '""')}"`;

                csv += `${t.id},${escapeCSV(p.name)},${escapeCSV(c.name)},${escapeCSV(prod.name)},${t.amount},${t.nbr},${t.gnbr},${escapeCSV(t.time_created)},${escapeCSV(t.comment)}\n`;
            });

            // Create invisible blob anchor and prompt download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "copiosis_statement.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        $(document).ready(function () {
            renderTransfers();
        });
    </script>
</body>
</html>
