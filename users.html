<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCopiosis - Users</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            color: #222;
            text-align: center;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .top-bar-container {
            max-width: 1100px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 0 16px;
            box-sizing: border-box;
        }

        .brand-title {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 2px 0;
        }

        .logo-img {
            width: 43px;
            height: 43px;
            display: block;
            margin: 4px 12px 4px 6px;
            transition: transform 0.2s ease;
        }

        .brand-title:hover .logo-img {
            transform: scale(1.08);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: #333;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
        }

            .nav-link:hover {
                background-color: #e6e6e6;
                border-color: #adadad;
                color: #333;
            }

            .nav-link.active {
                background-color: #e6e6e6;
                border-color: #adadad;
                color: #333;
                box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
                font-weight: bold;
            }

        /* Unified Menu Button Styling */
        .menu-btn {
            display: none;
            background: #ffffff;
            border: 1px solid #ccc;
            font-size: 28px;
            color: #555;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

            .menu-btn:hover {
                background-color: #f2f2f2;
            }

            .menu-btn:active {
                transform: scale(0.95);
            }

            /* The pressed-in state when the menu is open */
            .menu-btn.pressed {
                background-color: #e6e6e6;
                border-color: #adadad;
                box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
                color: #222;
            }

        @media (max-width: 900px) {
            .menu-btn {
                display: block;
            }

            .nav-menu {
                display: none;
                flex-direction: column;
                gap: 10px;
                background: #fff;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 16px;
                position: absolute;
                right: 16px;
                top: 100%;
                margin-top: 8px;
                width: 220px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.15);
                z-index: 1001;
                text-align: left;
                box-sizing: border-box;
            }

                .nav-menu.open {
                    display: flex;
                }

            .nav-link {
                border: none;
                background: transparent;
                padding: 4px 0;
                font-size: 16px;
                color: #000;
            }

                .nav-link:hover {
                    background: transparent;
                    color: #555;
                }

                .nav-link.active {
                    background: transparent;
                    color: #000;
                    font-weight: bold;
                    text-decoration: none;
                    box-shadow: none;
                }
        }

        .main-content {
            max-width: 1000px;
            margin: 90px auto 0 auto;
            padding: 16px;
        }

        /* Clean table styles (no checkered rows) */
        table.dataTable {
            width: 100% !important;
            margin-top: 16px !important;
            background: #fff;
            border-collapse: collapse;
        }

            table.dataTable thead th {
                background: #f2f2f2;
                border-bottom: 2px solid #ccc;
            }

            table.dataTable td, table.dataTable th {
                border-bottom: 1px solid #eee;
                padding: 8px 10px;
            }

        /* Row hover highlighting */
        #userTable tbody tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }

            #userTable tbody tr:hover {
                background-color: #eaeaea !important;
            }

        .assign-btn, .action-btn {
            background-color: #e6e6e6;
            border: 1px solid #adadad;
            color: #333;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
            margin-right: 4px;
        }

            .assign-btn:hover, .action-btn:hover {
                background-color: #ccc;
            }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="top-bar-container">
            <a href="index.html" class="brand-title" title="OpenCopiosis Home">
                <img src="OpenCopiosis.jfif" alt="OpenCopiosis Logo" class="logo-img" />
            </a>
            <div class="nav-item-dropdown-wrapper">
                <button class="menu-btn" onclick="toggleNav(event)" aria-label="Toggle menu">&#9776;</button>
                <nav id="navMenu" class="nav-menu">
                    <a href="users.html" class="nav-link active">Show users</a>
                    <a href="products.html" class="nav-link">Show products</a>
                    <a href="classes.html" class="nav-link">Show classes</a>
                    <a href="transfers.html" class="nav-link">Show transactions</a>
                    <a href="adduser.html" class="nav-link">Add user</a>
                    <a href="product.html" class="nav-link">Add item</a>
                    <a href="addclass.html" class="nav-link">Add class</a>
                    <a href="transfer.html" class="nav-link">Create transaction</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px;">
            <h3 style="margin: 0;">Showing All Users</h3>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn" onclick="window.location.href='fame.html'" style="padding: 10px 16px; font-size: 14px; margin-right: 0;">View Hall of Fame</button>
                <button class="action-btn" onclick="window.location.href='adduser.html'" style="padding: 10px 16px; font-size: 14px; margin-right: 0;">+ Create New User</button>
            </div>
        </div>
        <table id="userTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>NBR Balance</th>
                    <th><a href="fame.html" style="color: inherit; text-decoration: underline;" title="View Hall of Fame" onclick="event.stopPropagation();">Prestige</a></th>
                    <th>Assign Product</th>
                    <th>Operation</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <footer>
        &copy; <span id="currentYear"></span> OpenCopiosis
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="store.js"></script>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function toggleNav(e) {
            if (e) e.stopPropagation();
            const navMenu = document.getElementById('navMenu');
            const menuBtn = document.querySelector('.menu-btn');

            navMenu.classList.toggle('open');

            if (navMenu.classList.contains('open')) {
                menuBtn.classList.add('pressed');
            } else {
                menuBtn.classList.remove('pressed');
            }
        }

        document.addEventListener('click', function (e) {
            const wrapper = document.querySelector('.nav-item-dropdown-wrapper');
            const navMenu = document.getElementById('navMenu');
            const menuBtn = document.querySelector('.menu-btn');

            if (wrapper && !wrapper.contains(e.target)) {
                navMenu.classList.remove('open');
                if (menuBtn) menuBtn.classList.remove('pressed');
            }
        });

        function renderUserTable() {
            const users = DB.get('users') || [];
            const products = DB.get('products') || [];
            const tbody = $('#userTable tbody');
            tbody.empty();

            users.forEach(u => {
                if (u.id === 0) return;
                const productOptions = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

                const assignForm = `
                        <div style="display:flex; gap:4px; align-items:center;">
                            <select id="prodSelect_${u.id}" style="padding:2px 4px;" onclick="event.stopPropagation()">${productOptions}</select>
                            <button class="assign-btn" onclick="event.stopPropagation(); assignProduct(${u.id})">Assign</button>
                        </div>
                    `;
                const ops = `
                        <button class="action-btn" onclick="event.stopPropagation(); editUser(${u.id})">Edit</button>
                        <button class="action-btn" onclick="event.stopPropagation(); deleteUser(${u.id})">Delete</button>
                    `;
                tbody.append(`
                        <tr onclick="window.location.href='products.html?user_id=${u.id}'" title="View Assigned Products">
                            <td>#${u.id}</td>
                            <td>${u.name}</td>
                            <td>${u.nbr}</td>
                            <td>${u.fame}</td>
                            <td>${assignForm}</td>
                            <td>${ops}</td>
                        </tr>
                    `);
            });

            if ($.fn.DataTable.isDataTable('#userTable')) {
                $('#userTable').DataTable().destroy();
            }
            $('#userTable').DataTable({
                pageLength: 10,
                searching: true,
                ordering: true,
                stripeClasses: []
            });
        }

        function assignProduct(userId) {
            const prodId = parseInt($(`#prodSelect_${userId}`).val());
            let userProducts = DB.get('user_products') || [];
            const exists = userProducts.some(up => up.UserID === userId && up.ProductID === prodId);
            if (exists) {
                alert('Product is already assigned to this user.');
                return;
            }
            // Add time_created stamp so it shows under Producers
            userProducts.push({ UserID: userId, ProductID: prodId, gateway: 10, benefit: 5, time_created: new Date().toLocaleString() });
            DB.set('user_products', userProducts);
            alert('Product assigned successfully!');
            window.location.reload();
        }

        function editUser(userId) {
            let users = DB.get('users') || [];
            const u = users.find(x => x.id === userId);
            if (!u) return;
            const newName = prompt("Edit User Name:", u.name);
            if (newName && newName.trim()) {
                u.name = newName.trim();
                DB.set('users', users);
                window.location.reload();
            }
        }

        function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            let users = DB.get('users') || [];
            users = users.filter(u => u.id !== userId);
            DB.set('users', users);
            window.location.reload();
        }

        $(document).ready(function () {
            renderUserTable();
        });
    </script>
</body>
</html>
