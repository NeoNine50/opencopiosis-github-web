<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCopiosis - Products</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            color: #222;
            text-align: center;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .top-bar-container {
            max-width: 1100px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 0 16px;
            box-sizing: border-box;
        }

        .brand-title {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 2px 0;
        }

        .logo-img {
            width: 43px;
            height: 43px;
            display: block;
            margin: 4px 12px 4px 6px;
            transition: transform 0.2s ease;
        }

        .brand-title:hover .logo-img {
            transform: scale(1.08);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: #333;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
        }

            .nav-link:hover {
                background-color: #e6e6e6;
                border-color: #adadad;
                color: #333;
            }

            .nav-link.active {
                background-color: #e6e6e6;
                border-color: #adadad;
                color: #333;
                box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
                font-weight: bold;
            }

        /* Unified Menu Button Styling */
        .menu-btn {
            display: none;
            background: #ffffff;
            border: 1px solid #ccc;
            font-size: 28px;
            color: #555;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

            .menu-btn:hover {
                background-color: #f2f2f2;
            }

            .menu-btn:active {
                transform: scale(0.95);
            }

            /* The pressed-in state when the menu is open */
            .menu-btn.pressed {
                background-color: #e6e6e6;
                border-color: #adadad;
                box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
                color: #222;
            }

        @media (max-width: 900px) {
            .menu-btn {
                display: block;
            }

            .nav-menu {
                display: none;
                flex-direction: column;
                gap: 10px;
                background: #fff;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 16px;
                position: absolute;
                right: 16px;
                top: 100%;
                margin-top: 8px;
                width: 220px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.15);
                z-index: 1001;
                text-align: left;
                box-sizing: border-box;
            }

                .nav-menu.open {
                    display: flex;
                }

            .nav-link {
                border: none;
                background: transparent;
                padding: 4px 0;
                font-size: 16px;
                color: #000;
            }

                .nav-link:hover {
                    background: transparent;
                    color: #555;
                }

                .nav-link.active {
                    background: transparent;
                    color: #000;
                    font-weight: bold;
                    text-decoration: none;
                    box-shadow: none;
                }
        }

        .main-content {
            max-width: 1000px;
            margin: 90px auto 0 auto;
            padding: 16px;
        }

        /* Clean table styles matching users.html */
        table.dataTable {
            width: 100% !important;
            margin-top: 16px !important;
            background: #fff;
            border-collapse: collapse;
        }

            table.dataTable thead th {
                background: #f2f2f2;
                border-bottom: 2px solid #ccc;
            }

            table.dataTable td, table.dataTable th {
                border-bottom: 1px solid #eee;
                padding: 8px 10px;
            }

        /* Row hover highlighting for both tables */
        #productTable tbody tr, #userProductsTable tbody tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }

            #productTable tbody tr:hover, #userProductsTable tbody tr:hover {
                background-color: #eaeaea !important;
            }

        .action-btn {
            background-color: #e6e6e6;
            border: 1px solid #adadad;
            color: #333;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
            margin-right: 4px;
        }

            .action-btn:hover {
                background-color: #ccc;
            }

        /* Loader Overlay */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #ccc;
            border-top: 5px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <div id="loader-overlay"><div class="spinner"></div></div>

    <header class="top-bar">
        <div class="top-bar-container">
            <a href="index.html" class="brand-title" title="OpenCopiosis Home">
                <img src="OpenCopiosis.jfif" alt="OpenCopiosis Logo" class="logo-img" />
            </a>
            <div class="nav-item-dropdown-wrapper">
                <button class="menu-btn" onclick="toggleNav(event)" aria-label="Toggle menu">&#9776;</button>
                <nav id="navMenu" class="nav-menu">
                    <a href="users.html" class="nav-link">Show users</a>
                    <a href="products.html" class="nav-link active">Show items</a>
                    <a href="classes.html" class="nav-link">Show classes</a>
                    <a href="transfers.html" class="nav-link">Show transactions</a>
                    <a href="adduser.html" class="nav-link">Add user</a>
                    <a href="product.html" class="nav-link">Add product</a>
                    <a href="addclass.html" class="nav-link">Add class</a>
                    <a href="transfer.html" class="nav-link">Create transaction</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Products Table View -->
    <div class="main-content" id="productsView" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px;">
            <h3 style="margin: 0;">Item Library</h3>
            <button class="action-btn" onclick="window.location.href='product.html'" style="padding: 10px 16px; font-size: 14px; margin-right: 0;">+ Create New Item</button>
        </div>
        <table id="productTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Producers</th>
                    <th>Consumers</th>
                    <th>Created</th>
                    <th>Operation</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Producers Sub-View -->
    <div class="main-content" id="producersView" style="display: none;">
        <div style="text-align: left; margin-bottom: 12px;">
            <button id="backBtn" class="action-btn" style="font-size: 14px; padding: 6px 12px; margin-right: 0;" onclick="showLoading(); window.location.href='products.html'">&#8592; Back to Item List</button>
        </div>
        <h3 id="producersTitle" style="margin: 0 0 16px 0; text-align: center;">Producers</h3>
        <table id="userProductsTable">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Product</th>
                    <th>Gateway</th>
                    <th>Benefit</th>
                    <th>Created</th>
                    <th>Operation</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <footer>
        &copy; <span id="currentYear"></span> OpenCopiosis
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="store.js"></script>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function showLoading() {
            document.getElementById('loader-overlay').style.display = 'flex';
            document.querySelector('.main-content').style.opacity = '0.3';
        }

        function toggleNav(e) {
            if (e) e.stopPropagation();
            const navMenu = document.getElementById('navMenu');
            const menuBtn = document.querySelector('.menu-btn');

            navMenu.classList.toggle('open');

            if (navMenu.classList.contains('open')) {
                menuBtn.classList.add('pressed');
            } else {
                menuBtn.classList.remove('pressed');
            }
        }

        document.addEventListener('click', function (e) {
            const wrapper = document.querySelector('.nav-item-dropdown-wrapper');
            const navMenu = document.getElementById('navMenu');
            const menuBtn = document.querySelector('.menu-btn');

            if (wrapper && !wrapper.contains(e.target)) {
                navMenu.classList.remove('open');
                if (menuBtn) menuBtn.classList.remove('pressed');
            }
        });

        function renderProductTable() {
            const products = DB.get('products') || [];
            const transfers = DB.get('transfers') || [];
            const tbody = $('#productTable tbody');
            tbody.empty();

            products.forEach(p => {
                // Filter the transfers array to grab only transactions involving this specific product
                const productTransfers = transfers.filter(t => t.ProductID === p.id);

                // Use Set() to find unique Producer and Consumer IDs for this product
                const uniqueProducersCount = new Set(productTransfers.map(t => t.ProducerID)).size;
                const uniqueBeneficiariesCount = new Set(productTransfers.map(t => t.ConsumerID)).size;

                const ops = `
                    <button class="action-btn" onclick="event.stopPropagation(); showLoading(); window.location.href='products.html?producers_of=${p.id}';">Producers</button>
                    <button class="action-btn" onclick="event.stopPropagation(); editProduct(${p.id})">Edit name</button>
                    <button class="action-btn" onclick="event.stopPropagation(); deleteProduct(${p.id})">Delete</button>
                `;
                tbody.append(`
                    <tr onclick="window.location.href='products.html?producers_of=${p.id}'" title="View Producers">
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${uniqueProducersCount}</td>
                        <td>${uniqueBeneficiariesCount}</td>
                        <td>${p.time_created || 'N/A'}</td>
                        <td>${ops}</td>
                    </tr>
                `);
            });

            if ($.fn.DataTable.isDataTable('#productTable')) {
                $('#productTable').DataTable().destroy();
            }
            $('#productTable').DataTable({
                pageLength: 10,
                searching: true,
                ordering: true,
                stripeClasses: []
            });
        }

        function renderUserProductsTable(productId, userId) {
            const products = DB.get('products') || [];
            const userProducts = DB.get('user_products') || [];
            const users = DB.get('users') || [];

            let filteredUP = [];

            if (productId) {
                const currentProd = products.find(p => p.id === productId);
                const prodName = currentProd ? currentProd.name : 'Unknown';
                $('#producersTitle').text(`Producers of Item #${productId} (${prodName})`);
                filteredUP = userProducts.filter(up => up.ProductID === productId);
            } else if (userId) {
                const currentUser = users.find(u => u.id === userId);
                const userName = currentUser ? currentUser.name : 'Unknown';
                $('#producersTitle').text(`Assigned Products for User #${userId} (${userName})`);
                filteredUP = userProducts.filter(up => up.UserID === userId);

                // Switch the back button so it returns to the users list instead of products list
                $('#backBtn').attr('onclick', "showLoading(); window.location.href='users.html'");
                $('#backBtn').html("&#8592; Back to User List");
            }

            const tbody = $('#userProductsTable tbody');
            tbody.empty();

            filteredUP.forEach(up => {
                const u = users.find(usr => usr.id === up.UserID) || { name: 'Unknown', id: up.UserID };
                const p = products.find(prd => prd.id === up.ProductID) || { name: 'Unknown', id: up.ProductID };
                const ops = `
                    <button class="action-btn" onclick="event.stopPropagation(); editProductForUser(${up.UserID}, ${up.ProductID})">Edit Product</button>
                    <button class="action-btn" onclick="event.stopPropagation(); deleteProducerAssignment(${up.UserID}, ${up.ProductID})">Delete</button>
                `;
                tbody.append(`
                    <tr onclick="window.location.href='edituserproduct.html?user_id=${up.UserID}&product_id=${up.ProductID}'" title="Edit User Product Details">
                        <td>${u.name} (#${u.id})</td>
                        <td>${p.name} (#${p.id})</td>
                        <td>${up.gateway || 0}</td>
                        <td>${up.benefit || 0}</td>
                        <td>${up.time_created || 'N/A'}</td>
                        <td>${ops}</td>
                    </tr>
                `);
            });

            if ($.fn.DataTable.isDataTable('#userProductsTable')) {
                $('#userProductsTable').DataTable().destroy();
            }
            $('#userProductsTable').DataTable({
                pageLength: 10,
                searching: true,
                ordering: true,
                stripeClasses: []
            });
        }

        function editProduct(productId) {
            let products = DB.get('products') || [];
            const prod = products.find(p => p.id === productId);
            if (!prod) return;

            const newName = prompt("Enter new product name:", prod.name);
            if (newName === null) return;
            const trimmed = newName.trim();
            if (!trimmed) {
                alert("Product name cannot be empty.");
                return;
            }

            const exists = products.some(p => p.id !== productId && p.name.toLowerCase() === trimmed.toLowerCase());
            if (exists) {
                alert("A product with this name already exists.");
                return;
            }

            prod.name = trimmed;
            DB.set('products', products);
            window.location.reload();
        }

        function editProductForUser(userId, productId) {
            showLoading();
            window.location.href = `edituserproduct.html?user_id=${userId}&product_id=${productId}`;
        }

        function deleteProduct(productId) {
            if (!confirm("Are you sure you want to delete this product?")) return;

            let products = DB.get('products') || [];
            let userProducts = DB.get('user_products') || [];

            products = products.filter(p => p.id !== productId);
            userProducts = userProducts.filter(up => up.ProductID !== productId);

            DB.set('products', products);
            DB.set('user_products', userProducts);
            alert('Product deleted successfully!');
            window.location.reload();
        }

        function deleteProducerAssignment(userId, productId) {
            if (!confirm("Are you sure you want to remove this producer and their assigned values for this product?")) return;

            let userProducts = DB.get('user_products') || [];
            userProducts = userProducts.filter(up => !(up.UserID === userId && up.ProductID === productId));

            DB.set('user_products', userProducts);
            alert('Producer assignment removed successfully!');
            window.location.reload();
        }

        $(document).ready(function () {
            const urlParams = new URLSearchParams(window.location.search);
            const producersOf = urlParams.get('producers_of');
            const userId = urlParams.get('user_id');

            if (producersOf) {
                $('#productsView').hide();
                $('#producersView').show();
                renderUserProductsTable(parseInt(producersOf), null);
            } else if (userId) {
                $('#productsView').hide();
                $('#producersView').show();
                renderUserProductsTable(null, parseInt(userId));
            } else {
                $('#producersView').hide();
                $('#productsView').show();
                renderProductTable();
            }
        });
    </script>
</body>
</html>
